<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,600&display=swap" rel="stylesheet">

  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>

  <section class="card">

    <div class="bgimage">
      <img src="images/image-equilibrium.jpg" alt="NFT" class="image">
    
    <h2 class="title">  Equilibrium #3429</h2>
    <p class="description">  Our Equilibrium collection promotes balance and calm.</p>

    <div class="prices">
      <h2 class="price">0.041 ETH</h2>
      <p class="day">3 days left</p>
    </div>

    <div class="userdescription">
      <img src="images/image-avatar.png" alt="Usuario" class="imageUser">
      <p class="user">  Creation of <span class="jules">Jules Wyvern</span></p>
    </div>
    </div>
    
  </section>

</body>
</html>
